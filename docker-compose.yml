## =============================================================================
## plant-app — local dev compose
##
## Brings up Postgres only. The API runs natively via `pnpm dev:api` so its
## logs are easy to read and reload is fast. Native AI workers (apps/ai-worker)
## also run outside Docker — see that package's README for why.
##
## On the MacBook deploy target:
##  - Postgres still runs in Docker (multi-arch image; Apple Silicon supported).
##  - The Caddy service slot below gets uncommented for HTTPS via Tailscale.
##  - The API can run inside Docker too, or natively under launchd. Either way.
## =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plant_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-plant_app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plant} -d ${POSTGRES_DB:-plant_app}']
      interval: 5s
      timeout: 5s
      retries: 10

  ## --- MacBook deploy slot: uncomment when you're ready to expose the API ---
